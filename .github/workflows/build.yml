name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Étape 1 : Donner les droits d'exécution à Gradle (RÉSOUT L'ERREUR 127)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Étape 2 : Mise à jour vers Java 17 et la version v5 (plus récente)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Étape 3 : Compilation
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Étape 4 : Téléchargement de l'APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
