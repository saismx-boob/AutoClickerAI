name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Java 17 (requis par les versions récentes d'AGP)
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # PAS de Flutter ici — on utilise Gradle directement
      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compilation de l'APK (Release)
        run: ./gradlew assembleRelease

      - name: Sauvegarde de l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          
