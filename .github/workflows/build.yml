name: Build Android APK (Kaitlin)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Compilation de l'APK (Release)
        run: flutter build apk --release

      - name: Sauvegarde de l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kaitlin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          
